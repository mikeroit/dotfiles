# stow/tmux/.config/tmux/tmux.conf
# Step 1 of syncing tmux with the bash/kitty/waybar/rofi theme system:
# just git-status-in-the-bar for now. Base structural settings and
# soft/contrast color theming land in follow-up commits.

# --- Prefix key ---
# Ctrl-b is tmux's default but sits far from home row and collides with
# readline's back-one-char binding in-shell. Ctrl-Space is free of both
# problems and doesn't clash with any Hyprland/nvim binding already in use.
unbind C-b
set -g prefix C-Space
# Lets you send a literal Ctrl-Space to a nested/remote tmux (or any program
# that wants it) by pressing the prefix twice — same escape-hatch pattern
# tmux's default C-b/C-b provides.
bind C-Space send-prefix

# remap pane splitting key bindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# mouse mode
set -g mouse on

# --- Pane navigation (vim-style) ---
# Directional hjkl for moving between PANES (splits within a window), not
# windows (tabs) — matches the Hyprland SUPER+hjkl directional focus model,
# which also operates on tiled windows/splits rather than switching
# workspaces. Window switching stays on prefix + [0-9], already consistent
# with Hyprland's SUPER + [0-9] workspace switching.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable Vim keybindings in copy/scroll mode
set-window-option -g mode-keys vi

# Bind 'v' to begin selection (like visual mode in Vim)
bind-key -T copy-mode-vi v send -X begin-selection

# Bind 'y' to copy selection (like yank in Vim)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Optional: Bind 'V' to select the entire line
bind-key -T copy-mode-vi V send -X select-line

# --- Shell ---
# With default-command empty (tmux's default), tmux spawns each pane's shell
# as a LOGIN shell (argv[0] prefixed with '-'), regardless of how the shell
# that launched tmux was invoked. Login shells source /etc/profile then
# ~/.bash_profile (NOT ~/.bashrc) — and this system has no ~/.bash_profile
# bridging the two, so every tmux pane silently skipped .bashrc entirely:
# no aliases, no PS1/git-prompt, no custom anything. Setting default-command
# makes tmux exec the shell directly (non-login), matching what a normal
# interactive terminal window already gets outside tmux.
set -g default-command "${SHELL}"

# Poll frequently enough that branch/dirty-state changes (checkout, commit,
# stage) show up quickly. 1s matches kechol/tmux-git-status's own recommended
# value — the plugin's format strings are resolved by tmux's status-bar
# redraw, not pushed by the plugin itself, so this interval IS the latency.
set -g status-interval 1

# #{git_branch} and #{git_status} can get long (branch name + change counts),
# so status-right needs enough room or tmux silently truncates it.
set -g status-right-length 100
set -g status-right '#{git_branch} #{git_status} | %H:%M'

# --- Plugins ---
set -g @plugin 'kechol/tmux-git-status'

# --- TPM bootstrap ---
# Same clone-if-missing pattern as init.lua's lazy.nvim bootstrap: a fresh
# machine gets TPM for free on first tmux launch, no separate install step,
# no AUR package whose install path fights with TPM's own conventions.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Initialize TPM — must be the last line in the file (tpm's own requirement:
# everything above this needs to already be set before tpm sources plugins).
run '~/.tmux/plugins/tpm/tpm'


