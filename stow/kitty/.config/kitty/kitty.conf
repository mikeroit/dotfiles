# stow/kitty/.config/kitty/kitty-base.conf
# Non-theme settings only. Colors live in kitty-theme-{soft,contrast}.conf
# and get concatenated onto this file by scripts/gen-theme.sh to produce
# the real kitty.conf that kitty actually reads.

# --- Remote control (needed for gen-theme.sh's live-reload push) ---
allow_remote_control yes
listen_on unix:/tmp/kitty-socket-{kitty_pid}

# --- Font ---
# JetBrains Mono Nerd is already installed system-wide (ttf-jetbrains-mono-nerd),
# so no new package needed. Nerd Font variant gives you the glyph coverage
# waybar/wofi will also want later, so this stays consistent app-to-app.
font_family      JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures never

# --- Window/layout ---
window_padding_width 6
# Closing the last window/tab shouldn't prompt — tmux is the
# session-persistence layer, not kitty.
confirm_os_window_close 0

# --- Shell integration ---
# The bash package already ships a working prompt; this just lets kitty draw
# its own cursor/marks based on bash's exit-status reporting via shell hooks.
shell_integration enabled

# --- Scrollback ---
scrollback_lines 10000

# --- Cursor ---
#cursor_shape beam
# Steady cursor — a blinking cursor next to a blinking terminal cursor
# in nvim gets busy.
#cursor_blink_interval 0

# --- Keybinds ---
# Kept deliberately sparse. Anything that would collide with tmux's prefix
# or nvim's leader is avoided on purpose — see note below.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+f5 load_config_file
# stow/kitty/.config/kitty/kitty-theme-contrast.conf
# High-contrast palette for bright/outdoor lighting.
# Concatenated onto kitty-base.conf by gen-theme.sh to build kitty.conf.

foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #ffff00

# Cursor
cursor                  #ffff00
cursor_text_color       #000000

# URL underline color when hovering
url_color               #ffff00

# Kitty window border colors
active_border_color     #ffffff
inactive_border_color   #808080
bell_border_color       #ffff00

# Tab bar
active_tab_foreground   #000000
active_tab_background   #ffffff
inactive_tab_foreground #ffffff
inactive_tab_background #202020
tab_bar_background      #000000

# The 16 terminal colors. Unlike the soft theme, these push toward pure/
# saturated hues rather than pastel — the goal here is maximum legibility
# in direct sunlight, not aesthetic cohesion.
color0  #000000
color8  #555555
color1  #ff3333
color9  #ff5555
color2  #33ff33
color10 #55ff55
color3  #ffff33
color11 #ffff55
color4  #5599ff
color12 #77aaff
color5  #ff55ff
color13 #ff77ff
color6  #33ffff
color14 #55ffff
color7  #ffffff
color15 #ffffff
